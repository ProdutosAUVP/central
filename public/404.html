<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Central — AUVP</title>
    <script>
      // Redireciona 404 de volta para a raiz mantendo o path como query string.
      // O index.html restaura o path via history.replaceState antes do React montar.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + 1).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
</html>
