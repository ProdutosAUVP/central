    <script>
      // Aplica o tema antes do React montar para evitar flash de conteúdo claro.
      (function() {
        try {
          var stored = localStorage.getItem('auvp-theme');
          if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
    <script>
      // Restaura o path a partir da query string gerada pelo 404.html
      // para que o React Router receba a URL correta ao recarregar a página.
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + decoded[0] +
            (decoded[1] ? '?' + decoded[1] : '') +
            l.hash
          );
        }
      }(window.location));
    </script>
    <style>
      /*
       * Posiciona o botão nativo do Userback no mesmo canto que o gatinho
       * mas um nível abaixo (z-index 54 < z-[55] do React).
       * O gatinho fica visível; ao clicar, o elementFromPoint encontra
       * o botão do Userback abaixo e dispara seu handler nativo.
       * Todo o texto nativo ("Não encontrou o que precisava" etc.) é ocultado.
       */
      .userback-button-e,
      #userback-button-e,
      [id*="userback-button-e"] {
        bottom: 1.5rem !important;
        right: 1.5rem !important;
        z-index: 54 !important;
        opacity: 0 !important;
        /* Sem pointer-events:none — elementFromPoint precisa encontrá-lo */
      }

      /* Oculta qualquer texto / label nativo do widget Userback */
      [class*="userback-button"] span,
      [class*="userback-button"] p,
      [class*="userback-button"] .label,
      [class*="userback-button"] .ub-label,
      [class*="userback-button"] .ub-text,
      [id*="userback-button"] span,
      [id*="userback-button"] p,
      [id*="userback"] .ub-label,
      [id*="userback"] .ub-text,
      [class*="userback-launcher"],
      [id*="userback-launcher"] {
        display: none !important;
      }
    </style>
    <script>
      window.Userback = window.Userback || {};
      Userback.access_token = "A-F3dpS5OyrysALHYgAKS1QdXBt";
      (function(d) {
        var s = d.createElement('script');s.async = true;s.src = 'https://static.userback.io/widget/v1.js';(d.head || d.body).appendChild(s);
      })(document);
    </script>
