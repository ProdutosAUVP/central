    <script>
      // Aplica o tema antes do React montar para evitar flash de conteúdo claro.
      (function() {
        try {
          var stored = localStorage.getItem('auvp-theme');
          if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
    <script>
      // Restaura o path a partir da query string gerada pelo 404.html
      // para que o React Router receba a URL correta ao recarregar a página.
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + decoded[0] +
            (decoded[1] ? '?' + decoded[1] : '') +
            l.hash
          );
        }
      }(window.location));
    </script>
    <script>
      window.Userback = window.Userback || {};
      Userback.access_token = "A-F3dpS5OyrysALHYgAKS1QdXBt";
      /*
       * Esconde o launcher nativo do Userback assim que o widget carrega,
       * usando a API oficial `Userback.hide()`. O gatinho (FeedbackButton)
       * é o nosso disparador — ele chama `Userback.open('general', 'form')`.
       *
       * Usamos a API oficial em vez de forçar display:none no DOM porque o
       * hack de CSS também escondia o formulário aberto (o widget reaproveita
       * containers com "userback" no nome), impedindo o feedback de aparecer.
       */
      Userback.on_load = function() {
        if (typeof Userback.hide === 'function') Userback.hide();
      };
      (function(d) {
        var s = d.createElement('script');s.async = true;s.src = 'https://static.userback.io/widget/v1.js';(d.head || d.body).appendChild(s);
      })(document);
    </script>
