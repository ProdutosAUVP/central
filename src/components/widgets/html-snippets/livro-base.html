<!-- Livro — Estilos base compartilhados (inclua uma vez) -->
<style>
  .lv {
    --w: 200px;
    --d: 10px;
    --color: #F0BF4F;
    --fg: #111;
    width: var(--w);
    height: calc(var(--w) * 1.32);
    perspective: 1400px;
    display: inline-block;
  }
  .lv-inner {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
    transform: rotateY(0) rotateX(0);
    transition: transform .5s ease-out;
  }
  .lv:hover .lv-inner { transform: rotateY(-28deg) rotateX(4deg); }

  .lv-pages, .lv-spine { opacity: 0; transition: opacity .5s ease-out; }
  .lv:hover .lv-pages, .lv:hover .lv-spine { opacity: 1; }

  .lv-pages {
    position: absolute; top: 4px; bottom: 4px; right: 0; width: var(--d);
    transform: translateZ(calc(var(--d) / -2)) translateX(calc(var(--d) / 2)) rotateY(90deg);
    background: repeating-linear-gradient(90deg, hsl(0 0% 96%) 0 1px, hsl(0 0% 88%) 1px 2px);
    border-radius: 2px;
  }
  .lv-spine {
    position: absolute; top: 0; bottom: 0; left: 0; width: var(--d);
    transform: translateZ(calc(var(--d) / -2)) translateX(calc(var(--d) / -2)) rotateY(-90deg);
    background: linear-gradient(180deg, var(--color), color-mix(in oklab, var(--color) 70%, black));
    border-radius: 2px;
  }

  /* Cover */
  .lv-cover {
    position: absolute; inset: 0;
    background: #fff;
    border-radius: 8px; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 12px 24px -16px rgba(0,0,0,.25), 0 2px 6px rgba(0,0,0,.08), inset 0 0 0 1px rgba(0,0,0,.06);
  }

  /* Spine groove — default variant */
  .lv-cover::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: 8px; width: 1px;
    background: rgba(0,0,0,.12);
    z-index: 1; pointer-events: none;
  }
  .lv.simple .lv-cover::before { display: none; }

  /* Solid cover — when textColor is set (no white bottom) */
  .lv.solid .lv-cover { background: var(--color); }

  /* Textured cover */
  .lv.textured .lv-cover {
    background: var(--color);
    background-image: radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px);
    background-size: 4px 4px;
  }

  /* Top colored section */
  .lv-top {
    position: relative; height: 52%;
    background: var(--color);
    overflow: hidden;
  }
  .lv.solid .lv-top,
  .lv.textured .lv-top { background: transparent; }

  /* Stripe variant */
  .lv.stripe .lv-top::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 18%; height: 6px;
    background: color-mix(in oklab, var(--color) 55%, black); opacity: .55;
  }

  /* Illustration (fills top area) */
  .lv-illus {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }

  /* Icon (centered in top area) */
  .lv-icon {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: color-mix(in oklab, var(--color) 15%, #000);
  }

  /* Bottom section */
  .lv-bottom {
    flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
    padding: 16px 16px 16px 20px;
    color: var(--fg);
  }
  .lv.simple .lv-bottom { padding-left: 16px; }

  .lv-title {
    font: 700 17px/1.15 'Anek Latin', system-ui;
    letter-spacing: -.01em; margin: 0;
  }
</style>
