<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jornada do Herói — AUVP Design System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Anek+Latin:wght@400;700;800;900&family=Roboto:wght@400;700&display=swap');
    .font-anek { font-family: 'Anek Latin', sans-serif; }
    .font-roboto { font-family: 'Roboto', sans-serif; }
    .brand-gradient { background: linear-gradient(90deg, #1a1a1a 0%, #f59e0b 100%); }
    .fade-in { animation: fadeSlideIn 0.3s ease both; }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }
    .animate-bounce { animation: bounce 1s ease-in-out infinite; }
  </style>
</head>
<body class="bg-white text-neutral-900 font-roboto p-8">

  <div class="max-w-4xl mx-auto">

    <!-- Jornada Principal -->
    <div class="bg-white/40 rounded-xl p-5 md:p-8 border border-neutral-200 shadow-sm">

      <!-- Tooltip flutuante -->
      <div class="flex justify-center mb-8">
        <div class="animate-bounce">
          <div class="relative bg-neutral-900 text-white text-[11px] font-bold uppercase px-3 py-1.5 shadow-lg whitespace-nowrap tracking-wider">
            Clique nos pontos para ver a progressão
            <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-2 h-2 bg-neutral-900 rotate-45"></div>
          </div>
        </div>
      </div>

      <!-- Timeline -->
      <div class="relative w-full h-14 flex items-center justify-between mb-6 md:mb-10 px-2.5 select-none">
        <!-- Track de fundo -->
        <div class="absolute top-1/2 left-[22px] right-[22px] h-[3px] -translate-y-1/2 z-10 rounded-full bg-neutral-200">
          <div id="progressBar" class="absolute inset-y-0 left-0 brand-gradient rounded-full transition-all duration-500"
               style="width: 0%"></div>
        </div>

        <!-- Pontos -->
        <button onclick="goToStep(0)" id="dot0"
                class="relative z-20 w-6 h-6 rounded-full border-2 bg-white transition-all duration-300 hover:scale-[1.15] border-yellow-400">
          <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-3 h-3 rounded-full bg-neutral-900"></div>
        </button>
        <button onclick="goToStep(1)" id="dot1"
                class="relative z-20 w-6 h-6 rounded-full border-2 bg-white transition-all duration-300 hover:scale-[1.15] border-neutral-300">
        </button>
        <button onclick="goToStep(2)" id="dot2"
                class="relative z-20 w-6 h-6 rounded-full border-2 bg-white transition-all duration-300 hover:scale-[1.15] border-neutral-300">
        </button>
        <button onclick="goToStep(3)" id="dot3"
                class="relative z-20 w-6 h-6 rounded-full border-2 bg-white transition-all duration-300 hover:scale-[1.15] border-neutral-300">
        </button>
      </div>

      <!-- Conteúdo do Step -->
      <div id="stepContent" class="fade-in text-center md:text-left grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
        <!-- preenchido via JS -->
      </div>
    </div>

    <!-- Tabela Comparativa -->
    <div class="mt-8 bg-white/40 rounded-xl p-5 md:p-8 border border-neutral-200">
      <h4 class="font-bold text-sm uppercase tracking-wider text-yellow-600 mb-4">Comparativo de Evolução</h4>
      <div id="compTable" class="space-y-0">
        <!-- preenchido via JS -->
      </div>
    </div>

  </div>

  <script>
    const steps = [
      {
        stage: "Etapa 1",
        title: "Primeiros Passos",
        subtitle: "Organização financeira",
        salaryRange: "R$ 30k – 50k",
        salaryLabel: "Média Estimada",
        salaryUnit: "/ano",
      },
      {
        stage: "Etapa 2",
        title: "Construção de Patrimônio",
        subtitle: "Aportes consistentes",
        salaryRange: "R$ 65k – 91k",
        salaryLabel: "Média Estimada",
        salaryUnit: "/ano",
      },
      {
        stage: "Etapa 3",
        title: "Aceleração",
        subtitle: "Renda passiva crescente",
        salaryRange: "R$ 120k – 180k",
        salaryLabel: "Média Estimada",
        salaryUnit: "/ano",
      },
      {
        stage: "Etapa 4",
        title: "Liberdade Financeira",
        subtitle: "Independência total",
        salaryRange: "R$ 250k+",
        salaryLabel: "Média Estimada",
        salaryUnit: "/ano",
      },
    ];

    let active = 0;

    function goToStep(i) {
      active = i;
      const progress = (i / (steps.length - 1)) * 100;
      document.getElementById('progressBar').style.width = progress + '%';

      steps.forEach((_, idx) => {
        const dot = document.getElementById('dot' + idx);
        const inner = dot.querySelector('div');
        if (idx <= i) {
          dot.className = dot.className.replace('border-neutral-300', 'border-yellow-400');
          if (!inner) {
            const d = document.createElement('div');
            d.className = 'absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-3 h-3 rounded-full bg-neutral-900';
            dot.appendChild(d);
          }
        } else {
          dot.className = dot.className.replace('border-yellow-400', 'border-neutral-300');
          if (inner) inner.remove();
        }
      });

      renderContent();
      renderTable();
    }

    function renderContent() {
      const s = steps[active];
      const el = document.getElementById('stepContent');
      el.className = 'fade-in text-center md:text-left grid grid-cols-1 md:grid-cols-2 gap-8 items-center';
      void el.offsetWidth; // reflow to restart animation
      el.innerHTML = `
        <div>
          <span class="inline-block mb-3 uppercase tracking-widest text-xs font-extrabold font-anek bg-neutral-900 text-white px-3 py-1 rounded-full">${s.stage}</span>
          <h3 class="text-2xl md:text-3xl font-extrabold mb-2 font-anek">${s.title}</h3>
          <p class="text-sm md:text-lg text-neutral-500 font-roboto">${s.subtitle}</p>
        </div>
        <div class="bg-white/60 rounded-xl p-6 border shadow-inner flex flex-col items-center justify-center">
          <p class="text-[11px] uppercase tracking-widest font-bold mb-1 text-yellow-600 font-roboto">${s.salaryLabel}</p>
          <div class="text-3xl md:text-5xl font-black font-anek min-w-[220px] md:min-w-[280px] text-center">
            ${s.salaryRange}
            <span class="text-xs font-bold text-neutral-400 ml-1 font-roboto">${s.salaryUnit}</span>
          </div>
        </div>
      `;
    }

    function renderTable() {
      const el = document.getElementById('compTable');
      el.innerHTML = steps.map((s, i) => `
        <div onclick="goToStep(${i})"
             class="flex items-center justify-between py-3 border-b border-neutral-100 last:border-0 transition-colors cursor-pointer ${i === active ? 'bg-neutral-50 -mx-3 px-3 rounded' : 'hover:bg-neutral-50'}">
          <div class="flex items-center gap-3">
            <div class="w-2 h-2 rounded-full ${i <= active ? 'bg-neutral-900' : 'bg-neutral-300'}"></div>
            <span class="text-sm ${i === active ? 'font-bold' : 'text-neutral-500'}">${s.stage} — ${s.title}</span>
          </div>
          <span class="text-sm font-bold ${i === active ? 'text-yellow-600' : 'text-neutral-400'}">${s.salaryRange}</span>
        </div>
      `).join('');
    }

    goToStep(0);
  </script>
</body>
</html>
