<!-- Avaliação de Aula (HTML / CSS / JS standalone) -->
<style>
  .pr-modal { background:hsl(var(--card,0 0% 100%)); border:1px solid hsl(var(--border,120 10% 88%)); border-radius:16px; box-shadow:0 12px 40px rgba(0,0,0,.1); max-width:380px; padding:24px; text-align:center; font-family:'Roboto',sans-serif; color:hsl(var(--foreground,110 78% 9%)); }
  .pr-stars { display:flex; justify-content:center; gap:8px; margin-bottom:12px; }
  .pr-star { background:none; border:none; cursor:pointer; color:hsl(var(--muted-foreground,110 10% 40%)/0.3); transition:color .15s; }
  .pr-star svg { width:28px; height:28px; }
  .pr-star.on { color:hsl(var(--accent,155 93% 11%)); }
  .pr-cta { width:100%; background:hsl(var(--primary,155 93% 11%)); color:hsl(var(--primary-foreground,0 0% 100%)); border:none; padding:12px; border-radius:12px; font:700 13px 'Sora'; text-transform:uppercase; cursor:pointer; }
  .pr-cta:disabled { opacity:.4; cursor:not-allowed; }
</style>

<div class="pr-modal">
  <h3 style="font:700 20px 'Anek Latin'; margin:0 0 4px;">O que achou da aula?</h3>
  <p style="font:14px 'Roboto'; color:hsl(var(--muted-foreground,110 10% 40%)); margin:0 0 20px;">01. O despertar financeiro</p>
  <div class="pr-stars" id="stars">
    <button class="pr-star" data-v="1"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>
    <button class="pr-star" data-v="2"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>
    <button class="pr-star" data-v="3"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>
    <button class="pr-star" data-v="4"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>
    <button class="pr-star" data-v="5"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>
  </div>
  <p id="ratingLabel" style="font:14px 'Roboto'; color:hsl(var(--muted-foreground,110 10% 40%)); margin-bottom:16px;">Selecione uma nota</p>
  <button id="submit" class="pr-cta" disabled>Enviar Avaliação</button>
</div>

<script>
  const labels = ['', 'Péssima', 'Ruim', 'OK', 'Boa', 'Excelente!'];
  let rating = 0;
  document.querySelectorAll('#stars .pr-star').forEach(s => s.addEventListener('click', () => {
    rating = +s.dataset.v;
    document.querySelectorAll('#stars .pr-star').forEach((x, i) => x.classList.toggle('on', i < rating));
    document.getElementById('ratingLabel').textContent = labels[rating];
    document.getElementById('submit').disabled = false;
  }));
</script>
